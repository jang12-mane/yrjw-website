<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>우리의 400일 💌</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- 1. 봉투 화면 -->
  <div class="stage" id="stage-envelope">
    <div id="envelope-wrap">
      <div id="envelope">
        <div class="env-body"></div>
        <div class="env-heart">💗</div>
        <div class="env-flap"></div>
      </div>
      <div id="envelope-text">봉투를 눌러봐~</div>
    </div>
  </div>

  <!-- 2. 질문(키캡) 화면 -->
  <div class="stage hidden" id="stage-question">
    <div id="q-title">오늘은 우리가 만난 지<br>몇 일째 되는 날일까요~</div>
    <div class="keycap-grid" id="keycap-grid">
      <!-- data-value 로 각 칸의 값 지정, 400은 5번째(중앙) -->
      <button class="keycap" data-value="3">3일</button>
      <button class="keycap" data-value="100">100일</button>
      <button class="keycap" data-value="250">250일</button>
      <button class="keycap" data-value="300">300일</button>
      <button class="keycap" data-value="400">400일</button>
      <button class="keycap" data-value="500">500일</button>
      <button class="keycap" data-value="750">750일</button>
      <button class="keycap" data-value="900">900일</button>
      <button class="keycap" data-value="1000">1000일</button>
    </div>
  </div>

  <!-- 3. 최종 화면 (여기 텍스트/사진을 자유롭게 수정하세요) -->
  <div class="stage hidden" id="final-stage">
    <div id="final-title">🎉 우리의 400일 🎉</div>

    <!-- ▼ 사진 넣는 곳: src="..." 부분을 본인 사진 경로/URL로 바꾸면 됩니다 -->
    <div id="final-photo-frame">
      <img src="cat_1.jpg" alt="우리 사진">
    </div>

    <!-- ▼ 편지 내용 넣는 곳: 아래 텍스트를 원하는 편지 내용으로 바꾸면 됩니다 -->
    <div id="final-letter">400일 축하해~
      우리 오래오래 만나자~
      사랑해 ❤️❤️
    </div>

    <button id="replay-btn">다시 보기</button>
  </div>

</div>

<div id="wipe-overlay"></div>

<script src="script.js"></script>
</body>
</html>
